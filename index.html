<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Vault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
        }
        #calculator-container {
            max-width: 400px;
            margin: 50px auto;
        }
        #display {
            font-size: 2em;
            background: black;
            color: #0f0;
            border: 1px solid #0f0;
        }
        .btn-dark {
            background-color: #111;
            border-color: #333;
            color: #0f0;
        }
        .btn-dark:hover {
            background-color: #222;
            color: #0f0;
        }
        .nav-tabs .nav-link {
            color: #0f0;
            border-color: #0f0;
        }
        .nav-tabs .nav-link.active {
            background-color: #0f0;
            color: #000;
        }
        .media-item {
            position: relative;
            border: 1px solid #0f0;
            border-radius: 5px;
            overflow: hidden;
            background: #111;
        }
        .media-item img, .media-item video {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 0, 0, 0.7);
            color: white;
            border: none;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="calculator-container" class="container text-center">
    <h3>Calculator</h3>
    <input id="display" class="form-control text-end mb-3" readonly placeholder="0">

    <div class="row g-2">
        <button class="btn btn-dark col-3 py-3" onclick="press('1')">1</button>
        <button class="btn btn-dark col-3 py-3" onclick="press('2')">2</button>
        <button class="btn btn-dark col-3 py-3" onclick="press('3')">3</button>
        <button class="btn btn-danger col-3 py-3" onclick="clearDisplay()">C</button>

        <button class="btn btn-dark col-3 py-3" onclick="press('4')">4</button>
        <button class="btn btn-dark col-3 py-3" onclick="press('5')">5</button>
        <button class="btn btn-dark col-3 py-3" onclick="press('6')">6</button>
        <button class="btn btn-warning col-3 py-3" onclick="check()">=</button>

        <button class="btn btn-dark col-3 py-3" onclick="press('7')">7</button>
        <button class="btn btn-dark col-3 py-3" onclick="press('8')">8</button>
        <button class="btn btn-dark col-3 py-3" onclick="press('9')">9</button>
        <button class="btn btn-dark col-3 py-3" onclick="press('0')">0</button>
    </div>
</div>

<div id="vault-container" class="container mt-4" style="display: none;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>🔐 Secure Vault</h3>
        <button class="btn btn-outline-danger btn-sm" onclick="hideVault()">Logout</button>
    </div>

    <ul class="nav nav-tabs mb-3" id="vaultTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="images-tab" data-bs-toggle="tab" data-bs-target="#images" type="button" role="tab">Images</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="music-tab" data-bs-toggle="tab" data-bs-target="#music" type="button" role="tab">Music</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="videos-tab" data-bs-toggle="tab" data-bs-target="#videos" type="button" role="tab">Videos</button>
        </li>
    </ul>

    <div class="mb-3">
        <label for="fileInput" class="form-label">Upload Media</label>
        <input class="form-control bg-dark text-success border-success" type="file" id="fileInput" multiple onchange="handleUpload(this)">
    </div>

    <div class="tab-content" id="vaultTabContent">
        <div class="tab-pane fade show active" id="images" role="tabpanel">
            <div class="row g-3" id="images-gallery"></div>
        </div>
        <div class="tab-pane fade" id="music" role="tabpanel">
            <div class="list-group" id="music-gallery"></div>
        </div>
        <div class="tab-pane fade" id="videos" role="tabpanel">
            <div class="row g-3" id="videos-gallery"></div>
        </div>
    </div>
</div>

<div id="fake-vault" class="container mt-4 text-center" style="display: none;">
    <h3>📂 Fake Vault</h3>
    <p class="text-muted">No sensitive files found.</p>
    <button class="btn btn-outline-secondary" onclick="hideVault()">Back</button>
</div>

<script>
    let input = '';
    let db;

    // Initialize IndexedDB
    const request = indexedDB.open('VaultDB', 1);
    request.onupgradeneeded = (e) => {
        db = e.target.result;
        if (!db.objectStoreNames.contains('media')) {
            db.createObjectStore('media', { keyPath: 'id', autoIncrement: true });
        }
    };
    request.onsuccess = (e) => {
        db = e.target.result;
    };
    request.onerror = (e) => {
        console.error('IndexedDB error:', e.target.error);
    };

    function press(n) {
        input += n;
        document.getElementById('display').value = input;
    }

    function clearDisplay() {
        input = '';
        document.getElementById('display').value = '';
    }

    function check() {
        if (input === '1234') {
            showVault();
        } else if (input === '0000') {
            showFakeVault();
        } else {
            alert('❌ Wrong Password');
        }
        input = '';
        document.getElementById('display').value = '';
    }

    function showVault() {
        document.getElementById('calculator-container').style.display = 'none';
        document.getElementById('vault-container').style.display = 'block';
        document.getElementById('fake-vault').style.display = 'none';
        loadMedia();
    }

    function showFakeVault() {
        document.getElementById('calculator-container').style.display = 'none';
        document.getElementById('vault-container').style.display = 'none';
        document.getElementById('fake-vault').style.display = 'block';
    }

    function hideVault() {
        document.getElementById('calculator-container').style.display = 'block';
        document.getElementById('vault-container').style.display = 'none';
        document.getElementById('fake-vault').style.display = 'none';
    }

    function handleUpload(input) {
        const files = input.files;
        for (let i = 0; i < files.length; i++) {
            saveMedia(files[i]);
        }
        input.value = ''; // Reset input
    }

    async function saveMedia(file) {
        const reader = new FileReader();
        reader.onload = async (e) => {
            const transaction = db.transaction(['media'], 'readwrite');
            const store = transaction.objectStore('media');
            const mediaItem = {
                name: file.name,
                type: file.type,
                data: e.target.result,
                timestamp: Date.now()
            };
            store.add(mediaItem);
            transaction.oncomplete = () => {
                loadMedia();
            };
        };
        reader.readAsDataURL(file);
    }

    async function loadMedia() {
        if (!db) return;
        const transaction = db.transaction(['media'], 'readonly');
        const store = transaction.objectStore('media');
        const request = store.getAll();
        request.onsuccess = (e) => {
            renderMedia(e.target.result);
        };
    }

    function renderMedia(items) {
        const imagesGallery = document.getElementById('images-gallery');
        const musicGallery = document.getElementById('music-gallery');
        const videosGallery = document.getElementById('videos-gallery');

        imagesGallery.innerHTML = '';
        musicGallery.innerHTML = '';
        videosGallery.innerHTML = '';

        items.forEach(item => {
            const div = document.createElement('div');
            if (item.type.startsWith('image/')) {
                div.className = 'col-6 col-md-4';
                div.innerHTML = `
                    <div class="media-item">
                        <img src="${item.data}" alt="${item.name}" onclick="window.open('${item.data}')">
                        <button class="delete-btn" onclick="deleteMedia(${item.id})">×</button>
                    </div>
                `;
                imagesGallery.appendChild(div);
            } else if (item.type.startsWith('audio/')) {
                div.className = 'list-group-item bg-dark text-success border-success d-flex justify-content-between align-items-center';
                div.innerHTML = `
                    <span>${item.name}</span>
                    <div>
                        <audio src="${item.data}" controls class="me-2" style="height: 30px;"></audio>
                        <button class="btn btn-sm btn-danger" onclick="deleteMedia(${item.id})">×</button>
                    </div>
                `;
                musicGallery.appendChild(div);
            } else if (item.type.startsWith('video/')) {
                div.className = 'col-6 col-md-4';
                div.innerHTML = `
                    <div class="media-item">
                        <video src="${item.data}" controls></video>
                        <button class="delete-btn" onclick="deleteMedia(${item.id})">×</button>
                    </div>
                `;
                videosGallery.appendChild(div);
            }
        });
    }

    function deleteMedia(id) {
        const transaction = db.transaction(['media'], 'readwrite');
        const store = transaction.objectStore('media');
        store.delete(id);
        transaction.oncomplete = () => {
            loadMedia();
        };
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
